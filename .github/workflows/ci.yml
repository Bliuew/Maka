name: CI
on:
  push:
  pull_request:

jobs:
  api:
    name: API tests (Postgres + S3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: maka, POSTGRES_PASSWORD: maka, POSTGRES_DB: maka }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maka" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://maka:maka@localhost:5432/maka
      S3_BUCKET: maka-ci
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "1"
      S3_ACCESS_KEY_ID: maka
      S3_SECRET_ACCESS_KEY: maka-ci-secret
      S3_CREATE_BUCKET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Start MinIO (S3-compatible storage)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=maka -e MINIO_ROOT_PASSWORD=maka-ci-secret minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm test
