<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="Mäka — Feel The Power Of Love Within You. A 19+ social community.">
  <title>Mäka</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="shell">
  <aside class="sidebar" aria-label="Main menu">
    <div class="brand"><img src="/assets/icon-192.png" alt="">Mäka</div>
    <nav id="side-links"></nav>
    <small>Feel The Power Of Love Within You<br>Strictly 19+</small>
  </aside>
  <main class="main"><div class="app" id="app">
    <header class="topbar" id="topbar">
      <button class="title-brand" data-go="home" aria-label="Mäka home"><img src="/assets/icon-192.png" alt="">Mäka</button>
      <div class="toolbar">
        <button class="iconbutton" data-go="search" aria-label="Search">⌕</button>
        <button class="iconbutton" data-go="inbox" aria-label="Inbox">✉<span class="dot hidden" id="inboxDot"></span></button>
        <button class="iconbutton" data-go="profile" aria-label="Your profile">◉</button>
      </div>
    </header>
    <div class="screen" id="screen" tabindex="-1"></div>
    <nav class="bottom" id="bottom" aria-label="Primary"></nav>
    <div id="modalroot"></div><div id="toastroot" role="status" aria-live="polite"></div>
  </div></main>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
