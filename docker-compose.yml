# Local development services: PostgreSQL + MinIO (S3-compatible storage).
#   docker compose up -d
#   cp .env.example .env   (then: set -a; . ./.env; set +a; npm start)
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: maka, POSTGRES_PASSWORD: maka, POSTGRES_DB: maka }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: maka, MINIO_ROOT_PASSWORD: maka-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes: { pgdata: {}, miniodata: {} }
